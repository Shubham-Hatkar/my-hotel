
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
<style>
  :root{--brand:#C8A24B;--dark:#1f2622;--cream:#faf7f0;--gray:#E6E6E6;--text:#2b2b2b}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Open Sans',sans-serif;color:var(--text);background:var(--cream)}
  h1,h2,.logo{font-family:'Playfair Display',serif}
  header{position:sticky;top:0;z-index:40;background:var(--dark);color:#fff;display:flex;align-items:center;
    justify-content:space-between;padding:14px 32px}
  .logo{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:700}
  .logo img{height:60px;width:60px;object-fit:cover;border-radius:50%;border:3px solid var(--brand);
    box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .cart-btn{background:var(--brand);color:#1f2622;border:none;padding:10px 18px;border-radius:30px;
    font-weight:700;cursor:pointer;transition:.15s;position:relative}
  .cart-btn:hover{filter:brightness(1.08)}
  .badge{position:absolute;top:-8px;right:-8px;background:#DA291C;color:#fff;border-radius:50%;
    min-width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .demo-tag{background:#00A3E0;color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;margin-left:10px}
  .hero{min-height:420px;display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;color:#fff;padding:48px 24px;position:relative;overflow:hidden}
  .slides{position:absolute;inset:0;z-index:0}
  .slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s ease}
  .slide.active{opacity:1}
  .hero::after{content:"";position:absolute;inset:0;background:rgba(20,25,22,.55);z-index:1}
  .hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
  .hero h1{font-size:clamp(32px,5vw,56px)}
  .hero p{font-size:18px;margin-top:12px;opacity:.95}
  .map-btn{margin-top:22px;background:var(--brand);color:#1f2622;text-decoration:none;
    padding:12px 24px;border-radius:30px;font-weight:700;transition:.15s;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .map-btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
  .searchbar{max-width:1100px;margin:24px auto 0;padding:0 24px;display:flex;gap:12px;flex-wrap:wrap}
  .searchbar input{flex:1;min-width:200px;padding:12px 16px;border:1px solid var(--gray);border-radius:30px;font-family:inherit}
  .chip{border:1px solid var(--gray);background:#fff;padding:8px 16px;border-radius:30px;cursor:pointer;font-weight:600;transition:.15s}
  .chip.active{background:var(--dark);color:#fff;border-color:var(--dark)}
  main{max-width:1100px;margin:0 auto;padding:24px 24px 48px}
  .cat-title{font-size:28px;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid var(--brand)}
  .grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .card{background:#fff;border:1px solid var(--gray);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;flex-direction:column;transition:.2s}
  .card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
  .card .imgwrap{position:relative}
  .card img{width:100%;height:180px;object-fit:cover;background:#eee;display:block}
  .vtag{position:absolute;top:10px;left:10px;width:18px;height:18px;border-radius:4px;background:#fff;
    display:flex;align-items:center;justify-content:center;border:2px solid #2e7d32}
  .vtag.nonveg{border-color:#DA291C}
  .vtag i{width:8px;height:8px;border-radius:50%;background:#2e7d32}
  .vtag.nonveg i{background:#DA291C}
  .foodtag{position:absolute;top:10px;right:10px;background:var(--brand);color:#1f2622;font-size:11px;
    font-weight:700;padding:4px 10px;border-radius:20px}
  .card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card h3{font-size:18px}
  .card .desc{font-size:13px;color:#666;flex:1}
  .card .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .price{font-weight:800;color:var(--brand);font-size:18px}
  .add{background:var(--dark);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;transition:.15s}
  .add:hover{background:#000}
  .drawer{position:fixed;top:0;right:-420px;width:390px;max-width:90vw;height:100%;background:#fff;
    z-index:60;box-shadow:-4px 0 20px rgba(0,0,0,.15);transition:.3s;display:flex;flex-direction:column}
  .drawer.open{right:0}
  .drawer header{background:var(--dark)}
  .drawer .items{flex:1;overflow:auto;padding:16px}
  .line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--gray)}
  .line img{height:50px;width:50px;object-fit:cover;border-radius:8px}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:26px;height:26px;border:1px solid var(--gray);background:#fff;border-radius:6px;cursor:pointer;font-weight:700}
  .checkout-area{padding:16px;border-top:1px solid var(--gray)}
  .total{display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin-bottom:12px}
  input,textarea{width:100%;padding:10px;border:1px solid var(--gray);border-radius:8px;margin-bottom:8px;font-family:inherit}
  .primary{width:100%;background:var(--brand);color:#1f2622;border:none;padding:14px;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer}
  .primary:disabled{opacity:.5;cursor:not-allowed}
  .err{color:#DA291C;font-size:12px;margin:-4px 0 8px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
  .overlay.open{display:block}
  footer{background:var(--dark);color:#fff;text-align:center;padding:32px;margin-top:48px}
  .map-card{display:inline-flex;align-items:center;gap:14px;margin-top:18px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);padding:12px 20px;border-radius:14px;color:#fff;text-decoration:none;transition:.15s}
  .map-card:hover{background:rgba(255,255,255,.16)}
  .map-card img{height:44px;width:44px;object-fit:cover;border-radius:50%;border:2px solid var(--brand)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#1f2622;color:#fff;
    padding:14px 24px;border-radius:30px;z-index:80;transition:.3s;opacity:0}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .empty{text-align:center;color:#888;padding:40px 0}
</style>
</head>
<body>
  <header>
    <div class="logo"><img id="logo" alt="logo" /><span id="brandName">Loading…</span><span class="demo-tag" id="demoTag" style="display:none">DEMO</span></div>
    <button class="cart-btn" onclick="toggleCart(true)">🛒 Cart <span class="badge" id="badge">0</span></button>
  </header>

  <section class="hero" id="hero">
    <div class="slides" id="slides"></div>
    <div class="hero-content">
      <h1 id="heroTitle"></h1>
      <p id="heroTag"></p>
      <a class="map-btn" id="mapBtn" target="_blank" rel="noopener" style="display:none">📍 Find us on Google Maps</a>
    </div>
  </section>

  <div class="searchbar">
    <input id="search" placeholder="🔍 Search dishes…" oninput="applyFilter()" />
    <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </div>

  <main id="menu"><p class="empty">Loading menu…</p></main>

  <footer>
    <p id="fName"></p><p id="fContact"></p>
    <a class="map-card" id="mapLink" target="_blank" rel="noopener" style="display:none">
      <img id="footerLogo" alt="logo" /><span>📍 View our location on Google Maps</span>
    </a>
  </footer>

  <div class="overlay" id="overlay" onclick="toggleCart(false)"></div>
  <aside class="drawer" id="drawer">
    <header><span class="logo" style="font-size:18px">Your Order</span>
      <button class="cart-btn" style="padding:6px 12px" onclick="toggleCart(false)">✕</button></header>
    <div class="items" id="cartItems"></div>
    <div class="checkout-area">
      <div class="total"><span>Total</span><span id="cartTotal"></span></div>
      <input id="cName" placeholder="Your name" />
      <div class="err" id="eName"></div>
      <input id="cPhone" placeholder="Phone number" />
      <div class="err" id="ePhone"></div>
      <textarea id="cAddr" rows="2" placeholder="Delivery address"></textarea>
      <div class="err" id="eAddr"></div>
      <button class="primary" id="placeBtn" onclick="placeOrder()">Place Order</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

<script>
  // ▼▼▼ PASTE YOUR APPS SCRIPT WEB APP URL HERE (leave as-is to see the DEMO) ▼▼▼
  const API_URL = "https://script.google.com/macros/s/AKfycbwTaPxe-qM58KhFgt8jI9PHEVdKzJ2f82FDSRHQUfwrJJuGQ5IpjYfWI4BlmePRTozAfg/exec";
  const IS_LIVE = !API_URL.includes("XXXXX");

  // ── Your menu loaded as DEMO (so it previews instantly) ──
  const DEMO = {
    settings: {
      HotelName: "Vastad Special", Tagline: "Authentic flavours, served with love",
      LogoURL: "https://images.unsplash.com/photo-1552566626-52f8b828add9?w=100&h=100&fit=crop",
      Phone: "+91 98765 43210", Address: "Main Road, Your City", Currency: "₹",
      HeroImages: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600&h=600&fit=crop,https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1600&h=600&fit=crop,https://images.unsplash.com/photo-1552566626-52f8b828add9?w=1600&h=600&fit=crop,https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=1600&h=600&fit=crop",
      MapURL: "https://maps.google.com/?q=restaurant",
      BrandColor: "#C8A24B"
    },
    menu: [
      { Category: "Starters", ItemName: "Paneer Tikka", Description: "Char-grilled cottage cheese with spices", Price: 220, Type: "Veg", Tag: "Bestseller", Available: "Yes", PhotoURL: "" },
      { Category: "Main Course", ItemName: "Butter Chicken", Description: "Creamy tomato gravy with tender chicken", Price: 340, Type: "Nonveg", Tag: "Bestseller", Available: "Yes", PhotoURL: "" },
      { Category: "Soups", ItemName: "Veg Soup", Description: "Hearty mixed vegetable soup", Price: 90, Type: "Veg", Tag: "", Available: "Yes", PhotoURL: "" },
      { Category: "Soups", ItemName: "Chicken Soup", Description: "Warm, comforting chicken broth", Price: 120, Type: "Nonveg", Tag: "", Available: "Yes", PhotoURL: "" },
      { Category: "Rice & Biryani", ItemName: "Rice Plate", Description: "Steamed rice with dal & curry", Price: 130, Type: "Veg", Tag: "", Available: "Yes", PhotoURL: "" },
      { Category: "Rice & Biryani", ItemName: "Veg Biryani", Description: "Fragrant rice with mixed vegetables", Price: 180, Type: "Veg", Tag: "", Available: "Yes", PhotoURL: "" },
      { Category: "Rice & Biryani", ItemName: "Chicken Biryani", Description: "Aromatic biryani with tender chicken", Price: 240, Type: "Nonveg", Tag: "Bestseller", Available: "Yes", PhotoURL: "" },
      { Category: "Rice & Biryani", ItemName: "Mutton Biryani", Description: "Slow-cooked biryani with juicy mutton", Price: 300, Type: "Nonveg", Tag: "", Available: "Yes", PhotoURL: "" },
      { Category: "Chinese", ItemName: "Chicken Fried Rice", Description: "Wok-tossed rice with chicken & veggies", Price: 190, Type: "Nonveg", Tag: "", Available: "Yes", PhotoURL: "" },
      { Category: "Chinese", ItemName: "Chicken Noodles", Description: "Stir-fried noodles with chicken", Price: 190, Type: "Nonveg", Tag: "", Available: "Yes", PhotoURL: "" },
      { Category: "Desserts", ItemName: "Ice-Cream", Description: "Chilled creamy scoop of the day", Price: 80, Type: "Veg", Tag: "", Available: "Yes", PhotoURL: "" },
      { Category: "Beverages / Drinks", ItemName: "Thumbs Up", Description: "Chilled soft drink", Price: 40, Type: "Veg", Tag: "", Available: "Yes", PhotoURL: "" },
      { Category: "Thali", ItemName: "Veg Thali", Description: "Complete veg meal platter", Price: 200, Type: "Veg", Tag: "", Available: "Yes", PhotoURL: "" },
      { Category: "Thali", ItemName: "Chicken Thali", Description: "Full chicken meal with sides", Price: 280, Type: "Nonveg", Tag: "", Available: "Yes", PhotoURL: "" },
      { Category: "Thali", ItemName: "Mutton Thali", Description: "Full mutton meal with sides", Price: 340, Type: "Nonveg", Tag: "", Available: "Yes", PhotoURL: "" },
      { Category: "Thali", ItemName: "Vastad Special Chicken Thali", Description: "Our signature loaded chicken thali", Price: 380, Type: "Nonveg", Tag: "Chef's Special", Available: "Yes", PhotoURL: "" }
    ]
  };

  let CFG = { currency: "₹" };
  let ALL_ITEMS = [];
  let activeCat = "All";
  const cart = {};
  const $ = function (id) { return document.getElementById(id); };

  function unsplash(id) { return "https://images.unsplash.com/photo-" + id + "?w=500&h=350&fit=crop"; }

  // ── EXACT photo match for YOUR dishes (most accurate) ──
  const EXACT_PICS = {
    "paneer tikka":"1567188040759-fb8a883dc6d8",
    "butter chicken":"1603894584373-5ac82b2ae398",
    "veg soup":"1547592180-85f173990554",
    "chicken soup":"1604152135912-04a022e23696",
    "rice plate":"1516684732162-798a0062be99",
    "veg biryani":"1589302168068-964664d93dc0",
    "chicken biryani":"1563379091339-03b21ab4a4f8",
    "mutton biryani":"1631515243349-e0cb75fb8d3a",
    "chicken fried rice":"1603133872878-684f208fb84b",
    "chicken noodles":"1585032226651-759b368d7246",
    "ice-cream":"1560008581-09826d1de69e",
    "ice cream":"1560008581-09826d1de69e",
    "thumbs up":"1581006852262-e4307cf6283a",
    "veg thali":"1567620905732-2d1ec7ab7445",
    "chicken thali":"1626500155537-90f5e3e0c4f5",
    "mutton thali":"1585937421612-70a008356fbe",
    "vastad special chicken thali":"1601050690597-df0568f70950"
  };

  // ── Keyword fallback (for any future dishes) ──
  const FOOD_PICS = {
    paneer:"1567188040759-fb8a883dc6d8", tikka:"1567188040759-fb8a883dc6d8",
    soup:"1547592180-85f173990554", biryani:"1563379091339-03b21ab4a4f8",
    "fried rice":"1603133872878-684f208fb84b", noodles:"1585032226651-759b368d7246",
    thali:"1567620905732-2d1ec7ab7445", mutton:"1585937421612-70a008356fbe",
    chicken:"1603894584373-5ac82b2ae398", fish:"1580476262798-bddd9f4b7369",
    egg:"1607103058027-4c5e5c8b1c4a", rice:"1516684732162-798a0062be99",
    dal:"1546833999-b9f581a1996d", curry:"1631452180519-c014fe946bc7",
    naan:"1626777552726-4a6b54c97e46", bread:"1626777552726-4a6b54c97e46",
    roti:"1626777552726-4a6b54c97e46", pizza:"1513104890138-7c749659a591",
    burger:"1568901346375-23c9450c58cd", dosa:"1630383249896-424e482df921",
    kebab:"1599487488170-d11ec9c172f0", tandoori:"1599487488170-d11ec9c172f0",
    "ice-cream":"1560008581-09826d1de69e", icecream:"1560008581-09826d1de69e",
    gulab:"1601303516361-1a4e6e0f1b1b", cake:"1578985545062-69928b1d9587",
    dessert:"1551024601-bec78aea704b", chai:"1571934811356-5cc061b6821f",
    tea:"1571934811356-5cc061b6821f", coffee:"1509042239860-f550ce710b93",
    lassi:"1553530666-ba11a7da3888", juice:"1600271886742-f049cd451bba",
    thumbs:"1581006852262-e4307cf6283a", soda:"1581006852262-e4307cf6283a",
    cola:"1581006852262-e4307cf6283a", drink:"1544145945-f90425340c7e",
    beverage:"1544145945-f90425340c7e"
  };
  const DEFAULT_PIC = "1504674900247-0877df9cc836"; // generic food platter

  // Auto-picks a photo: exact name first, then keyword, then default
  function autoPhoto(item) {
    const name = (item.ItemName || "").toLowerCase().trim();
    if (EXACT_PICS[name]) return unsplash(EXACT_PICS[name]);
    const text = (name + " " + (item.Category || "")).toLowerCase();
    let id = DEFAULT_PIC;
    for (const key in FOOD_PICS) { if (text.includes(key)) { id = FOOD_PICS[key]; break; } }
    return unsplash(id);
  }

  // Converts a Google Drive link, OR auto-picks a photo if the field is empty
  function driveFix(url, item) {
    if (!url || !String(url).trim()) return item ? autoPhoto(item) : unsplash(DEFAULT_PIC);
    const m = String(url).match(/\/d\/([\w-]+)/) || String(url).match(/id=([\w-]+)/);
    return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1600" : url;
  }

  function money(n) { return CFG.currency + Number(n).toLocaleString(); }
  function esc(s) { return String(s).replace(/'/g, "\\'"); }

  function startSlides(imgs) {
    const box = $("slides");
    box.innerHTML = imgs.map(function (u, i) {
      return "<div class='slide" + (i === 0 ? " active" : "") + "' style=\"background-image:url('" + driveFix(u) + "')\"></div>";
    }).join("");
    const slides = box.querySelectorAll(".slide");
    if (slides.length < 2) return;
    let idx = 0;
    setInterval(function () {
      slides[idx].classList.remove("active");
      idx = (idx + 1) % slides.length;
      slides[idx].classList.add("active");
    }, 4000); // change image every 4 seconds
  }

  function getHeroImages(s) {
    let imgs = s.HeroImages || s.HeroImage;
    if (Array.isArray(imgs)) return imgs.filter(Boolean);
    if (imgs) return String(imgs).split(",").map(function (x) { return x.trim(); }).filter(Boolean);
    return DEMO.settings.HeroImages.split(",");
  }

  async function load() {
    let data;
    try {
      if (!IS_LIVE) throw new Error("demo");
      data = await (await fetch(API_URL)).json();
    } catch (e) {
      data = DEMO;
      $("demoTag").style.display = "inline-block";
    }
    const s = Array.isArray(data.settings) ? {} : data.settings;
    CFG.currency = s.Currency || "₹";
    if (s.BrandColor) document.documentElement.style.setProperty("--brand", s.BrandColor);
    document.title = s.HotelName || "Hotel";
    $("brandName").textContent = s.HotelName || "Hotel";
    $("logo").src = driveFix(s.LogoURL);
    $("footerLogo").src = driveFix(s.LogoURL);
    $("heroTitle").textContent = s.HotelName || "Welcome";
    $("heroTag").textContent = s.Tagline || "";
    $("fName").textContent = s.HotelName || "";
    $("fContact").textContent = [s.Address, s.Phone].filter(Boolean).join("  •  ");

    if (s.MapURL) {
      $("mapBtn").href = s.MapURL; $("mapBtn").style.display = "inline-block";
      $("mapLink").href = s.MapURL; $("mapLink").style.display = "inline-flex";
    }

    startSlides(getHeroImages(s));

    ALL_ITEMS = data.menu.filter(function (i) { return i.ItemName && String(i.Available).toLowerCase() !== "no"; });
    buildChips();
    renderMenu();
  }

  function buildChips() {
    const cats = ["All"].concat(ALL_ITEMS.map(function (i) { return i.Category || "Menu"; })
      .filter(function (v, idx, arr) { return arr.indexOf(v) === idx; }));
    $("chips").innerHTML = cats.map(function (c) {
      return "<div class='chip" + (c === activeCat ? " active" : "") + "' onclick=\"setCat('" + esc(c) + "')\">" + c + "</div>";
    }).join("");
  }
  function setCat(c) { activeCat = c; buildChips(); renderMenu(); }
  function applyFilter() { renderMenu(); }

  function renderMenu() {
    const term = $("search").value.trim().toLowerCase();
    const items = ALL_ITEMS.filter(function (i) {
      const catOk = activeCat === "All" || (i.Category || "Menu") === activeCat;
      const searchOk = !term || (i.ItemName + " " + (i.Description || "")).toLowerCase().includes(term);
      return catOk && searchOk;
    });
    const cats = {};
    items.forEach(function (i) { (cats[i.Category || "Menu"] = cats[i.Category || "Menu"] || []).push(i); });

    let html = "";
    Object.keys(cats).forEach(function (cat) {
      html += "<h2 class='cat-title'>" + cat + "</h2><div class='grid'>";
      cats[cat].forEach(function (i) {
        const isNon = String(i.Type).toLowerCase() === "nonveg";
        const photo = driveFix(i.PhotoURL, i); // auto-picks when empty
        html += "<div class='card'><div class='imgwrap'>" +
          "<img src='" + photo + "' alt='" + i.ItemName + "'>" +
          "<span class='vtag" + (isNon ? " nonveg" : "") + "'><i></i></span>" +
          (i.Tag ? "<span class='foodtag'>" + i.Tag + "</span>" : "") +
          "</div><div class='card-body'><h3>" + i.ItemName + "</h3>" +
          "<p class='desc'>" + (i.Description || "") + "</p>" +
          "<div class='row'><span class='price'>" + money(i.Price) + "</span>" +
          "<button class='add' onclick=\"addItem('" + esc(i.ItemName) + "'," + i.Price + ",'" + esc(photo) + "')\">Add +</button>" +
          "</div></div></div>";
      });
      html += "</div>";
    });
    $("menu").innerHTML = html || "<p class='empty'>No dishes match your search.</p>";
  }

  function addItem(name, price, img) {
    if (!cart[name]) cart[name] = { name: name, price: price, img: img, qty: 0 };
    cart[name].qty++;
    renderCart();
    showToast(name + " added");
  }
  function changeQty(name, d) {
    if (!cart[name]) return;
    cart[name].qty += d;
    if (cart[name].qty <= 0) delete cart[name];
    renderCart();
  }
  function renderCart() {
    const list = Object.values(cart);
    let count = 0, total = 0, html = "";
    list.forEach(function (c) {
      count += c.qty; total += c.qty * c.price;
      html += "<div class='line'><img src='" + c.img + "'>" +
        "<div style='flex:1'><b>" + c.name + "</b><br><small>" + money(c.price) + "</small></div>" +
        "<div class='qty'><button onclick=\"changeQty('" + esc(c.name) + "',-1)\">−</button>" +
        "<span>" + c.qty + "</span>" +
        "<button onclick=\"changeQty('" + esc(c.name) + "',1)\">+</button></div></div>";
    });
    $("cartItems").innerHTML = html || "<p class='empty'>Your cart is empty.</p>";
    $("badge").textContent = count;
    $("cartTotal").textContent = money(total);
  }
  function toggleCart(open) {
    $("drawer").classList.toggle("open", open);
    $("overlay").classList.toggle("open", open);
  }
  function showToast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 2000);
  }
  function validate() {
    let ok = true;
    const checks = [["cName", "eName", /.{2,}/, "Enter your name"],
      ["cPhone", "ePhone", /^[+\d][\d\s-]{7,}$/, "Enter a valid phone"],
      ["cAddr", "eAddr", /.{5,}/, "Enter your address"]];
    checks.forEach(function (c) {
      const bad = !c[2].test($(c[0]).value.trim());
      $(c[1]).textContent = bad ? c[3] : "";
      if (bad) ok = false;
    });
    return ok;
  }
  async function placeOrder() {
    const items = Object.values(cart);
    if (!items.length) return showToast("Cart is empty");
    if (!validate()) return;
    const total = items.reduce(function (s, c) { return s + c.qty * c.price; }, 0);
    const btn = $("placeBtn"); btn.disabled = true; btn.textContent = "Placing…";
    try {
      if (IS_LIVE) {
        await fetch(API_URL, {
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ name: $("cName").value, phone: $("cPhone").value,
            address: $("cAddr").value, items: items, total: total })
        });
      }
      Object.keys(cart).forEach(function (k) { delete cart[k]; });
      renderCart(); toggleCart(false);
      ["cName", "cPhone", "cAddr"].forEach(function (id) { $(id).value = ""; });
      showToast(IS_LIVE ? "✅ Order placed! We'll call you shortly." : "✅ Demo order placed (no data sent)");
    } catch (e) {
      showToast("Failed. Please try again.");
    }
    btn.disabled = false; btn.textContent = "Place Order";
  }

  document.addEventListener("keydown", function (e) { if (e.key === "Escape") toggleCart(false); });
  load();
</script>
</body>
</html>
